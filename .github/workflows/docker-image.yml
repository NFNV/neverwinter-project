name: Build and publish NWN PW image

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

env:
  IMAGE_NAME: ghcr.io/nfnv/neverwinter-project
  STATUS_IMAGE_NAME: ghcr.io/nfnv/nwn-status-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: vars
        run: |
          TAGS="${{ env.IMAGE_NAME }}:staging-latest"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${{ env.IMAGE_NAME }}:${VERSION},${{ env.IMAGE_NAME }}:prod-latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.tags }}

      - name: Build and push status backend image
        uses: docker/build-push-action@v6
        with:
          context: ./status_backend
          file: ./status_backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.STATUS_IMAGE_NAME }}:prod-latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ secrets.GCP_ZONE || vars.GCP_ZONE }}
      GCP_INSTANCE: ${{ secrets.GCP_INSTANCE || vars.GCP_INSTANCE }}
      WIF_PROVIDER: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER || vars.WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL || vars.GCP_SERVICE_ACCOUNT_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "Missing WORKLOAD_IDENTITY_PROVIDER (secret or variable)."
            exit 1
          fi
          if [ -z "$GCP_SERVICE_ACCOUNT_EMAIL" ]; then
            echo "Missing GCP_SERVICE_ACCOUNT_EMAIL (secret or variable)."
            exit 1
          fi
          if [ -z "$GCP_PROJECT_ID" ] || [ -z "$GCP_ZONE" ] || [ -z "$GCP_INSTANCE" ]; then
            echo "Missing GCP project/zone/instance (secret or variable)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          if [ ! -f ~/.ssh/google_compute_engine ]; then
            ssh-keygen -t rsa -b 3072 -f ~/.ssh/google_compute_engine -N "" -q
          fi

      - name: Deploy to VM
        run: |
          gcloud --quiet compute scp ops/docker-compose.prod.yml \
            "${GCP_INSTANCE}:/opt/neverwinter-project/ops/docker-compose.prod.yml" \
            --project "${GCP_PROJECT_ID}" \
            --zone "${GCP_ZONE}" \
            --tunnel-through-iap
          gcloud --quiet compute ssh "${GCP_INSTANCE}" \
            --project "${GCP_PROJECT_ID}" \
            --zone "${GCP_ZONE}" \
            --tunnel-through-iap \
            --command "sudo docker-compose -f /opt/neverwinter-project/ops/docker-compose.prod.yml pull && sudo docker-compose -f /opt/neverwinter-project/ops/docker-compose.prod.yml up -d && sudo docker ps"
