name: Build and publish NWN PW image

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

env:
  IMAGE_NAME: ghcr.io/nfnv/neverwinter-project
  STATUS_IMAGE_NAME: ghcr.io/nfnv/nwn-status-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tags
        id: vars
        run: |
          TAGS="${{ env.IMAGE_NAME }}:staging-latest"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${{ env.IMAGE_NAME }}:${VERSION},${{ env.IMAGE_NAME }}:prod-latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.tags }}

      - name: Build and push status backend image
        uses: docker/build-push-action@v6
        with:
          context: ./status_backend
          file: ./status_backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.STATUS_IMAGE_NAME }}:prod-latest
